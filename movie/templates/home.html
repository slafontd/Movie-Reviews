<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6F" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>


<!-- <h1>Welcome to Home Page</h1> -->
<h1>Welcome to Home Page, {{'Santiago Lafont Díaz'}}</h1> 
<h2>This is the full home page</h2> 


<div class="container">
    <form action="" class="mb-3" role="search" aria-label="Search Movie">
        <div class="mb-3">
            <label for="searchMovie" class="form-label">Search for a movie</label>
            <input type="text" class="form-control" name="searchMovie" id="searchMovie"/>
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>

    {% if searchTerm %}
        <p>Searching for: {{ searchTerm }}</p>
    {% endif %}

    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3">
        {% for movie in movies %}
            <div class="col">
                <div class="card h-100">
                    <!-- Imagen más pequeña -->
                    <img src="{{ movie.image.url }}" class="card-img-top" alt="{{ movie.title }}" style="height: 150px; object-fit: cover;">
                    <div class="card-body p-2"> <!-- p-2 reduce el padding interno -->
                        <h6 class="card-title fw-bold mb-1">{{ movie.title }}</h6> <!-- h6 es más pequeño que h5 -->
                        <p class="card-text small">{{ movie.description|truncatechars:60 }}</p> <!-- small hace el texto más pequeño y truncatechars limita los caracteres -->
                        {% if movie.url %}
                            <a href="{{ movie.url }}" class="btn btn-primary btn-sm">Movie Link</a> <!-- btn-sm hace el botón más pequeño -->
                        {% endif %}
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
